upstream core {
    server backend-core:8000;
}

upstream chat {
    server backend-chat:8001;
}

server {
    listen 80;

    # 1. Django 일반 페이지 및 API 처리
    location / {
        proxy_pass http://core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. 미디어 파일 처리 (이미지 업로드/조회 필수!)
    location /media/ {
        alias /app/media/;  # docker-compose에서 연결한 경로
    }

    # 3. 채팅 서버 (WebSocket)
    location /ws/ {
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ✨ 4. SSE 스트림 (미션 실시간 업데이트)
    location /stream/ {
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';  # SSE는 keep-alive 필요
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # SSE 핵심 설정
        proxy_buffering off;              # nginx 버퍼링 비활성화 (즉시 전송)
        proxy_cache off;                  # 캐시 비활성화
        proxy_read_timeout 86400;         # 24시간 타임아웃
        chunked_transfer_encoding off;    # 청크 전송 비활성화
        
        # CORS 설정 (필요시)
        add_header Cache-Control 'no-cache';
        add_header X-Accel-Buffering 'no';
    }

    # 5. 정적 파일 처리 (CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }
}