upstream core {
    server backend-core:8000;
}

upstream chat {
    server backend-chat:8001;
}

# 1. HTTP 접속을 HTTPS로 자동 리다이렉트
server {
    listen 80;
    server_name uniquestpiro.xyz www.uniquestpiro.xyz;
    return 301 https://$host$request_uri;
}

# 2. 실제 HTTPS 통신 설정
server {
    listen 443 ssl;
    server_name uniquestpiro.xyz www.uniquestpiro.xyz;

    # 발급받은 인증서 경로 (docker-compose에서 연결해줄 경로입니다)
    ssl_certificate /etc/letsencrypt/live/uniquestpiro.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniquestpiro.xyz/privkey.pem;

    # SSL 보안 최적화 설정 (선택사항이지만 권장)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Django 일반 페이지 및 API 처리
    location / {
        proxy_pass http://core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 미디어 파일 처리
    location /media/ {
        alias /app/media/;
    }

    # 채팅 서버 (WebSocket) - HTTPS 환경에서는 wss:// 로 접속하게 됩니다
    location /ws/ {
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SSE 스트림 (미션 실시간 업데이트)
    location /stream/ {
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        chunked_transfer_encoding off;
        
        add_header Cache-Control 'no-cache';
        add_header X-Accel-Buffering 'no';
    }

    # 정적 파일 처리
    location /static/ {
        alias /app/staticfiles/;
    }
}