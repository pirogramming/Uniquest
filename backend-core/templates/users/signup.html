{%load static%}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="{%static 'users/css/signup.css'%}">
</head>
<body>
    <div class="signup-container">
        <h2>회원가입</h2>

        <div class="input-group">
            <label for="username">이름</label>
            <input type="text" name="username" id="username" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="input-group">
            <label for="nickname">닉네임</label>
            <input type="text" name="nickname" id="nickname" placeholder="사용하실 닉네임을 입력하세요" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" name="password" id="password" placeholder="비밀번호" required>
        </div>

        <div class="input-group">
            <label for="password_check">비밀번호 확인</label>
            <input type="password" name="password_check" id="password_check" placeholder="비밀번호 재입력" required>
        </div>

        <div class="input-group">
            <label for="email">이메일</label>
            <div class="email-section">
                <input type="email" name="email" id="email" placeholder="school@ac.kr" required>
                <button type="button" class="btn-sub" id="send-btn" onclick="send_number()" action="verify-email">인증번호 발송</button>
                <div class="btn-sub" id="complete" style="display:none;">완료</div>
            </div>

            <div id="check_number_box" style="display:none;">
                <label for="number" style="display: block; margin-bottom: 5px;">인증번호 입력</label>
                <div class="verify-group">
                    <input type="number" name="number" id="number" placeholder="6자리 숫자" required>
                    <button type="button" class="btn-sub" onclick="check_number()">확인</button>
                    <div id="timer-display" style="font-weight: bold; margin-top: 10px; color: blue;">
                        남은 시간: 05:00
                    </div>
                </div>
            </div>
            <div id="check_number_box_certified">
                <div class="certified-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                        <circle cx="12" cy="12" r="10" stroke-width="2"></circle>
                    </svg>
                    <span>이메일 인증 완료!</span>
                </div>
            </div>
        </div>

        <button type="button" class="btn-main" onclick="handleSignup()">회원가입 완료</button>
        <div class="footer">
            <p>이미 계정이 있습니까?</p>
            <a href="{%url 'users:login'%}" id="signup">로그인하기</a>
        </div>
    </div>
    <script src="{%static 'users/js/signup.js'%}"></script>
</body>
</html>
