<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>미션 목록</title>
<style>
  body { font-family: system-ui; padding: 16px; }
  a { text-decoration: none; }
  .card { border:1px solid #eee; border-radius:12px; padding:12px; margin:10px 0; }
  .muted { color:#666; font-size: 13px; }
</style>
</head>
<body>
  <h2>미션 목록</h2>
  <p>
    <a href="{% url 'missions:mission_create' %}">+ 새 미션</a> |
    <a href="/missions/?urgent=1">#급해요만</a>
  </p>

  {% for m in missions %}
    <div class="card">
      <div><a href="{% url 'missions:mission_detail' m.id %}"><b>{{ m.title }}</b></a></div>
      <div class="muted">{{ m.category }} / {{ m.status }} / {{ m.created_at }}</div>
      {% if m.location_name %}
        <div class="muted">📍 {{ m.location_name }}</div>
      {% endif %}
      <div>
        {% for t in m.tags.all %}
          <span class="muted">#{{ t.name }}</span>
        {% endfor %}
      </div>
    </div>
  {% empty %}
    <p>아직 미션이 없습니다.</p>
  {% endfor %}
</body>
</html>
