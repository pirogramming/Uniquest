services:
  # [1] 게이트웨이: 외부 요청을 백엔드 서버들로 배분
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend-core/media:/app/media
    depends_on:
      - backend-core
      - backend-chat

  # [2] 메인 서버 (Django): 유저, 미션, 정산 등 핵심 비즈니스 로직
  backend-core:
    build: ./backend-core
    command: >
      sh -c "until python -c 'import psycopg2; psycopg2.connect(dbname=\"postgres\", user=\"postgres\", password=\"postgres\", host=\"postgres\")' 2>/dev/null; do
               echo '데이터베이스 서버를 기다리는 중...'
               sleep 1
             done
             python ensure_db.py
             python manage.py migrate
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend-core:/app
      - ./backend-core/media:/app/media
    environment:
      - TZ=Asia/Seoul
      # 기존 볼륨에 postgres 역할이 있으면 이걸로 통일 (볼륨 새로 만들면 user/password로 바꿔도 됨)
      - POSTGRES_DB=uniquest
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - EMAIL_HOST_USER=your_email@gmail.com
      - EMAIL_HOST_PASSWORD=your_password
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  # [3] 채팅 서버 (FastAPI): 실시간 웹소켓 통신 및 MongoDB 저장
  backend-chat:
    build: ./backend-chat
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend-chat:/app
    environment:
      - TZ=Asia/Seoul
      - REDIS_HOST=redis
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mongo
      - redis
    ports:
      - "8001:8001"

  # [4] 관계형 DB (PostgreSQL): 유저, 미션 데이터 저장
  postgres:
    image: postgres:13
    environment:
      # backend-core와 동일 (기존 볼륨이 postgres로 초기화돼 있으면 이걸로 통일)
      - POSTGRES_DB=uniquest
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # [5] NoSQL DB (MongoDB): 채팅 메시지 로그 대량 저장
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  # [6] 메시지 브로커 (Redis): 서버 간 통신 및 캐싱
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data: